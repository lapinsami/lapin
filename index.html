<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lapin</title>
    <style>
        body {
            margin: 0;
            padding: 0;
        }
        main {
            margin: 0;
            padding: 0;
        }
        .container {
            display: grid;
            width: 100vw;
            height: 100vh;
            grid-template-columns: auto 75% auto;
            grid-template-rows: 100px 50px auto 50px;
            padding: 0;
            margin: 0;
            background-color: black;
            overflow: hidden;
        }
        .header {
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .navigation {
            grid-column-start: 1;
            grid-column-end: 4;
        }
        .footer {
            grid-column-start: 1;
            grid-column-end: 4;
            grid-row-start: 4;
            grid-row-end: 5;
        }
        .left-pad {
            grid-column-start: 1;
            grid-column-end: 2;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        .right-pad {
            grid-column-start: 3;
            grid-column-end: 4;
            grid-row-start: 3;
            grid-row-end: 4;
        }
        .content {
            grid-column-start: 2;
            grid-column-end: 3;
            grid-row-start: 3;
            grid-row-end: 4;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="header"></div>
    <div class="navigation"></div>
    <div class="left-pad"></div>
    <div class="content">
        <p style="color: white; text-align: center">Lapin</p>
    </div>
    <div class="right-pad"></div>
    <div class="footer"></div>
</div>
</body>
</html>
